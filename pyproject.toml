[project]
name = "agentic-security-reference"
version = "0.1.0"
description = "Reference architecture and runnable demo for agentic security: task-scoped delegated authority, credential custody, effect budgets, evidence and kill switches."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "voltagebots" }]
dependencies = [
    "PyJWT[crypto]==2.15.1",
    "agent-warrant==0.1.0",
    "toolcall-authz==0.3.0",
]

[project.urls]
Repository = "https://github.com/agent-rails/agentic-security-reference"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["executor", "issuer", "demo", "live"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["executor", "issuer"]
