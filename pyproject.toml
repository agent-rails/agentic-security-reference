[project]
name = "agentic-security-reference"
version = "0.1.0"
description = "Reference architecture and runnable demo for agentic security: task-scoped delegated authority, credential custody, effect budgets, evidence and kill switches."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "voltagebots" }]
dependencies = [
    "PyJWT[crypto]==2.15.1",
    "agent-warrant @ git+https://github.com/agent-rails/agent-warrant@e2b4e24662cb005999382029904cfee4f9d3769a",
    "toolcall-authz @ git+https://github.com/agent-rails/agent-guard@f12a648eae45256b9a393d9271aa1d20094f366f",
]

[project.urls]
Repository = "https://github.com/agent-rails/agentic-security-reference"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["executor", "issuer", "demo", "live"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["executor", "issuer"]
